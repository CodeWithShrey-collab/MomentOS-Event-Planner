# Render Blueprint for one-origin Flask + React + PostgreSQL deployment.
# This file only describes infrastructure; it does not create services until
# an authorized user imports the Blueprint in Render.
services:
  - type: web
    name: momentos-event-planner
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    region: singapore
    numInstances: 1
    autoDeployTrigger: 'off'
    maxShutdownDelaySeconds: 90
    healthCheckPath: /api/v1/health/ready
    preDeployCommand: python -m flask --app backend.wsgi:app db upgrade
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_BASE_URL
        sync: false
      - key: TRUSTED_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: momentos-postgres
          property: connectionString
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: Lax
      - key: AI_MODE
        value: live
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: OPENAI_MAX_OUTPUT_TOKENS
        value: "3000"
      - key: OPENAI_TIMEOUT_SECONDS
        value: "25"
      - key: AI_DAILY_REQUEST_LIMIT
        value: "20"
      - key: AI_PER_MINUTE_LIMIT
        value: "5"
      - key: RATE_LIMIT_STORAGE_URI
        fromService:
          name: momentos-rate-limits
          type: keyvalue
          property: connectionString
      - key: PROXY_FIX_X_FOR
        sync: false
      - key: PROXY_FIX_X_PROTO
        sync: false
      - key: PROXY_FIX_X_HOST
        value: "0"
      - key: MAX_CONTENT_LENGTH
        value: "262144"

  - type: keyvalue
    name: momentos-rate-limits
    plan: 256mb
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: momentos-postgres
    databaseName: momentos
    user: momentos
    plan: 0.1c-256mb
    region: singapore
    diskSizeGB: 1
    ipAllowList: []
